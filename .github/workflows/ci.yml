name: CI

on:
  push:
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck
      - name: Run shellcheck
        run: |
          shellcheck -x migrate-to-versioned.sh \
                        bin/openclaw-rollback \
                        lib/state-snapshot.sh \
                        install.sh
